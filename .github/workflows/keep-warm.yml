name: Keep backend warm

# Pings the Render backend on a schedule so the free tier doesn't spin down
# (which is what makes the first request after idle take 30-60s).
# Note: GitHub's scheduled runs are best-effort and can be delayed a few minutes.
# GitHub also pauses schedules after ~60 days with no repo activity.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "Pinging backend to keep it warm..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 90 \
            https://backend-wm93.onrender.com/ || true
